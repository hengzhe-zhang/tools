<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>间歇计时器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 400px;
            width: 100%;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            background: white;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 30px;
            margin: 30px 0;
            text-align: center;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .timer-display {
            font-size: 48px;
            font-weight: bold;
            color: white;
            margin-bottom: 10px;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .progress-info {
            color: rgba(255, 255, 255, 0.9);
            font-size: 18px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: white;
            border-radius: 4px;
            transition: width 1s linear;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-start {
            background: #4caf50;
            color: white;
        }

        .btn-start:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .btn-pause {
            background: #ff9800;
            color: white;
        }

        .btn-pause:hover {
            background: #f57c00;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.4);
        }

        .btn-reset {
            background: #f44336;
            color: white;
        }

        .btn-reset:hover {
            background: #da190b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .toggle-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 15px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .toggle-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toggle-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .toggle-item label {
            margin: 0;
            cursor: pointer;
            user-select: none;
            font-size: 14px;
        }

        .notification-btn {
            background: #2196F3;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .notification-btn:hover {
            background: #1976D2;
        }

        .notification-btn:disabled {
            background: #ccc;
        }

        .status {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #666;
            font-weight: 500;
            min-height: 20px;
        }

        .notification-status {
            text-align: center;
            margin-top: 10px;
            font-size: 12px;
            color: #888;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .timer-display {
                font-size: 36px;
            }
            
            .progress-info {
                font-size: 16px;
            }

            .toggle-group {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⏱️ 间歇计时器</h1>
        
        <div class="input-group">
            <label for="rounds">循环次数</label>
            <input type="number" id="rounds" min="1" max="9999" value="100" placeholder="输入循环次数">
        </div>
        
        <div class="input-group">
            <label for="seconds">每次秒数</label>
            <input type="number" id="seconds" min="1" max="3600" value="20" placeholder="输入每次秒数">
        </div>
        
        <div class="display">
            <div class="timer-display" id="timerDisplay">00:00</div>
            <div class="progress-info" id="progressInfo">准备就绪</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn-start" id="startBtn" onclick="startTimer()">开始</button>
            <button class="btn-pause" id="pauseBtn" onclick="pauseTimer()" disabled>暂停</button>
            <button class="btn-reset" id="resetBtn" onclick="resetTimer()">重置</button>
        </div>
        
        <div class="toggle-group">
            <div class="toggle-item">
                <input type="checkbox" id="soundEnabled" checked>
                <label for="soundEnabled">声音提示</label>
            </div>
            <div class="toggle-item">
                <input type="checkbox" id="notificationEnabled">
                <label for="notificationEnabled">通知提示</label>
            </div>
            <button class="notification-btn" id="requestNotificationBtn" onclick="requestNotificationPermission()" style="display: none;">
                允许通知
            </button>
        </div>
        
        <div class="status" id="status"></div>
        <div class="notification-status" id="notificationStatus"></div>
        <div style="text-align: center; margin-top: 10px;">
            <button class="notification-btn" id="testNotificationBtn" onclick="testNotification()" style="display: none; margin: 0 auto;">
                测试通知
            </button>
        </div>
    </div>

    <script>
        let timer = null;
        let currentRound = 0;
        let totalRounds = 0;
        let secondsPerRound = 0;
        let currentSeconds = 0;
        let isPaused = false;
        let isRunning = false;
        let notificationPermission = false;

        // 创建音频上下文
        let audioContext = null;

        // 检查通知权限状态
        function checkNotificationPermission() {
            if (!('Notification' in window)) {
                document.getElementById('notificationEnabled').style.display = 'none';
                document.getElementById('notificationStatus').textContent = '❌ 此浏览器不支持通知功能';
                console.log('浏览器不支持 Notification API');
                return;
            }
            
            console.log('当前通知权限状态:', Notification.permission);
            
            if (Notification.permission === 'granted') {
                notificationPermission = true;
                document.getElementById('notificationEnabled').checked = true;
                document.getElementById('requestNotificationBtn').style.display = 'none';
                document.getElementById('testNotificationBtn').style.display = 'inline-block';
                document.getElementById('notificationStatus').textContent = '✅ 通知已启用（点击测试按钮验证）';
            } else if (Notification.permission === 'denied') {
                notificationPermission = false;
                document.getElementById('notificationEnabled').checked = false;
                document.getElementById('notificationEnabled').disabled = true;
                document.getElementById('requestNotificationBtn').style.display = 'none';
                document.getElementById('testNotificationBtn').style.display = 'none';
                document.getElementById('notificationStatus').innerHTML = '❌ 通知被阻止<br>请在浏览器设置→网站设置→通知中允许此网站';
            } else {
                document.getElementById('requestNotificationBtn').style.display = 'inline-block';
                document.getElementById('testNotificationBtn').style.display = 'none';
                document.getElementById('notificationEnabled').checked = false;
                document.getElementById('notificationStatus').textContent = '点击"允许通知"按钮启用通知功能';
            }
            
            // 检查是否在HTTPS环境
            if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
                document.getElementById('notificationStatus').innerHTML += '<br>⚠️ 注意：通知功能需要HTTPS或localhost环境';
            }
        }

        // 请求通知权限
        async function requestNotificationPermission() {
            if (!('Notification' in window)) {
                alert('您的浏览器不支持通知功能');
                return;
            }
            
            try {
                const permission = await Notification.requestPermission();
                console.log('权限请求结果:', permission);
                
                if (permission === 'granted') {
                    notificationPermission = true;
                    document.getElementById('notificationEnabled').checked = true;
                    document.getElementById('requestNotificationBtn').style.display = 'none';
                    document.getElementById('testNotificationBtn').style.display = 'inline-block';
                    document.getElementById('notificationStatus').textContent = '✅ 通知已启用';
                    
                    // 发送测试通知
                    testNotification();
                } else if (permission === 'denied') {
                    notificationPermission = false;
                    document.getElementById('notificationEnabled').checked = false;
                    document.getElementById('notificationStatus').textContent = '❌ 通知权限被拒绝，请在浏览器设置中手动开启';
                    alert('通知权限被拒绝，请在浏览器设置中手动开启通知权限');
                } else {
                    document.getElementById('notificationStatus').textContent = '请在浏览器权限设置中允许通知';
                }
            } catch (error) {
                console.error('请求通知权限失败:', error);
                alert('请求通知权限失败：' + error.message);
            }
        }
        
        // 测试通知函数
        function testNotification() {
            console.log('发送测试通知...');
            try {
                const testNotif = new Notification('测试通知 ⏱️', {
                    body: '通知功能正常工作！\n如果您看到这条消息，说明通知已成功启用。',
                    tag: 'test',
                    renotify: true,
                    requireInteraction: false
                });
                
                testNotif.onshow = () => console.log('测试通知已显示');
                testNotif.onerror = (e) => console.error('测试通知错误:', e);
                
                setTimeout(() => testNotif.close(), 5000);
            } catch (error) {
                console.error('测试通知失败:', error);
                alert('通知测试失败，可能需要在HTTPS环境下使用');
            }
        }

        // 发送通知 - 增强兼容性版本
        function sendNotification(round) {
            console.log('尝试发送通知，权限状态:', Notification.permission);
            
            if (!('Notification' in window)) {
                console.log('浏览器不支持通知');
                return;
            }
            
            if (Notification.permission !== 'granted') {
                console.log('通知权限未授予');
                return;
            }
            
            if (!document.getElementById('notificationEnabled').checked) {
                console.log('通知已被用户关闭');
                return;
            }
            
            try {
                // 创建通知选项
                const options = {
                    body: `第 ${round} 轮完成！\n进度: ${round}/${totalRounds}`,
                    icon: '/favicon.ico', // 使用实际图标路径，base64可能不被支持
                    tag: 'timer-round-' + round,
                    renotify: true, // 允许重复通知
                    requireInteraction: false,
                    silent: false, // 确保有声音
                    data: { round: round, total: totalRounds }
                };
                
                // 尝试添加振动（部分设备支持）
                if ('vibrate' in navigator) {
                    options.vibrate = [200, 100, 200];
                }
                
                // 创建通知
                const notification = new Notification('间歇计时器 ⏱️', options);
                
                console.log('通知已创建:', notification);
                
                // 添加事件监听
                notification.onclick = function() {
                    window.focus();
                    notification.close();
                };
                
                notification.onshow = function() {
                    console.log('通知已显示');
                };
                
                notification.onerror = function(e) {
                    console.error('通知显示错误:', e);
                };
                
                // 5秒后自动关闭通知
                setTimeout(() => {
                    notification.close();
                }, 5000);
                
            } catch (error) {
                console.error('发送通知失败:', error);
                // 尝试备用方法
                try {
                    // 某些浏览器可能需要使用 ServiceWorker
                    if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
                        navigator.serviceWorker.ready.then(function(registration) {
                            registration.showNotification('间歇计时器 ⏱️', {
                                body: `第 ${round} 轮完成！进度: ${round}/${totalRounds}`,
                                tag: 'timer-round-' + round,
                                renotify: true
                            });
                        });
                    }
                } catch (swError) {
                    console.error('ServiceWorker 通知也失败:', swError);
                }
            }
        }

        // 初始化音频
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // 播放提示音（只在每轮结束时播放）
        function playBeep(frequency = 800, duration = 300) {
            if (!document.getElementById('soundEnabled').checked) return;
            
            try {
                initAudio();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = frequency;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration / 1000);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + duration / 1000);
            } catch (e) {
                console.log('音频播放失败:', e);
            }
        }

        function updateDisplay() {
            const minutes = Math.floor(currentSeconds / 60);
            const seconds = currentSeconds % 60;
            document.getElementById('timerDisplay').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            document.getElementById('progressInfo').textContent = 
                `第 ${currentRound} / ${totalRounds} 轮`;
            
            const roundProgress = ((secondsPerRound - currentSeconds) / secondsPerRound) * 100;
            document.getElementById('progressFill').style.width = `${roundProgress}%`;
        }

        function startTimer() {
            if (!isRunning) {
                totalRounds = parseInt(document.getElementById('rounds').value) || 100;
                secondsPerRound = parseInt(document.getElementById('seconds').value) || 20;
                currentRound = 1;
                currentSeconds = secondsPerRound;
                isRunning = true;
                isPaused = false;
            } else if (isPaused) {
                isPaused = false;
            }
            
            document.getElementById('startBtn').disabled = true;
            document.getElementById('pauseBtn').disabled = false;
            document.getElementById('resetBtn').disabled = false;
            document.getElementById('rounds').disabled = true;
            document.getElementById('seconds').disabled = true;
            document.getElementById('status').textContent = '计时进行中...';
            
            updateDisplay();
            
            timer = setInterval(() => {
                if (!isPaused) {
                    currentSeconds--;
                    updateDisplay();
                    
                    if (currentSeconds <= 0) {
                        // 播放提示音
                        playBeep(1000, 300);
                        
                        // 发送通知
                        sendNotification(currentRound);
                        
                        if (currentRound >= totalRounds) {
                            clearInterval(timer);
                            document.getElementById('status').textContent = '✅ 计时完成！';
                            document.getElementById('progressInfo').textContent = '全部完成！';
                            
                            // 完成时的特殊通知
                            if (Notification.permission === 'granted' && document.getElementById('notificationEnabled').checked) {
                                try {
                                    const finalNotification = new Notification('间歇计时器 - 完成！🎉', {
                                        body: `恭喜！全部 ${totalRounds} 轮已完成！`,
                                        tag: 'timer-complete',
                                        requireInteraction: true, // 需要用户手动关闭
                                        renotify: true
                                    });
                                    
                                    if ('vibrate' in navigator) {
                                        navigator.vibrate([200, 100, 200, 100, 200]);
                                    }
                                } catch (error) {
                                    console.error('完成通知发送失败:', error);
                                }
                            }
                            
                            resetButtons();
                        } else {
                            currentRound++;
                            currentSeconds = secondsPerRound;
                            updateDisplay();
                        }
                    }
                }
            }, 1000);
        }

        function pauseTimer() {
            if (!isPaused) {
                isPaused = true;
                document.getElementById('pauseBtn').textContent = '继续';
                document.getElementById('status').textContent = '已暂停';
            } else {
                isPaused = false;
                document.getElementById('pauseBtn').textContent = '暂停';
                document.getElementById('status').textContent = '计时进行中...';
            }
        }

        function resetTimer() {
            clearInterval(timer);
            timer = null;
            currentRound = 0;
            currentSeconds = 0;
            isPaused = false;
            isRunning = false;
            
            document.getElementById('timerDisplay').textContent = '00:00';
            document.getElementById('progressInfo').textContent = '准备就绪';
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('status').textContent = '';
            document.getElementById('pauseBtn').textContent = '暂停';
            
            resetButtons();
        }

        function resetButtons() {
            document.getElementById('startBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
            document.getElementById('resetBtn').disabled = false;
            document.getElementById('rounds').disabled = false;
            document.getElementById('seconds').disabled = false;
            isRunning = false;
        }

        // 监听通知复选框变化
        document.getElementById('notificationEnabled').addEventListener('change', function(e) {
            if (e.target.checked) {
                if (Notification.permission === 'granted') {
                    notificationPermission = true;
                    document.getElementById('testNotificationBtn').style.display = 'inline-block';
                    testNotification(); // 发送测试通知
                } else if (Notification.permission === 'default') {
                    requestNotificationPermission();
                } else {
                    alert('通知权限已被拒绝，请在浏览器设置中手动开启');
                    e.target.checked = false;
                }
            } else {
                document.getElementById('testNotificationBtn').style.display = 'none';
            }
        });

        // 防止手机锁屏
        if ('wakeLock' in navigator) {
            let wakeLock = null;
            
            async function requestWakeLock() {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {
                    console.log('Wake Lock error:', err);
                }
            }
            
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible' && isRunning) {
                    requestWakeLock();
                }
            });
        }

        // 页面加载时检查通知权限
        window.addEventListener('load', () => {
            checkNotificationPermission();
        });
    </script>
</body>
</html>
