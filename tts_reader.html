<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>朗读助手</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            line-height: 1.6;
            background-color: #121212;
            color: #eeeeee;
        }
        h1 {
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            min-height: 250px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #444;
            border-radius: 4px;
            box-sizing: border-box;
            resize: vertical;
            background-color: #1e1e1e;
            color: #eeeeee;
        }
        .controls {
            margin-top: 15px;
        }
        button {
            padding: 8px 16px;
            margin-right: 10px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: #0066cc;
            color: #ffffff;
        }
        button:disabled {
            background-color: #444444;
            color: #888888;
            cursor: not-allowed;
        }
        button#backwardBtn {
            background-color: #cc6600;
        }
        button#backwardBtn:disabled {
            background-color: #444444;
        }
        select, input[type="number"] {
            background-color: #1e1e1e;
            color: #eeeeee;
            border: 1px solid #444;
        }
        .settings-row {
            margin-top: 10px;
        }
        .setting-group {
            display: inline-block;
            margin-right: 30px;
        }
    </style>
</head>
<body>
    <h1>朗读助手</h1>
    <p>这是一个简洁的文本朗读工具，利用浏览器的语音合成功能将文字朗读出来。您可以选择朗读人、调整朗读速度，并在工作之余小憩时用它来放松。所有设置以及当前文本、朗读位置都会自动保存到本地，关闭电脑后再打开也可从上次位置继续。</p>
    
    <label for="textInput" style="display:none;">输入文本</label>
    <textarea id="textInput" placeholder="在此粘贴或输入文本"></textarea>
    
    <div class="controls settings-row">
        <div class="setting-group">
            <label for="voiceSelect">朗读人：</label>
            <select id="voiceSelect"></select>
        </div>
        
        <div class="setting-group">
            <label for="rateInput">速度：</label>
            <input id="rateInput" type="number" min="0.5" max="2" step="0.1" value="1" style="width:60px;" />
            <span id="rateDisplay"></span>
        </div>
        
        <div class="setting-group">
            <label for="backwardWords">后退词数：</label>
            <input id="backwardWords" type="number" min="5" max="50" step="5" value="10" style="width:60px;" />
            <span>词</span>
        </div>
    </div>
    
    <div class="controls" style="margin-top: 15px;">
        <button id="startBtn">开始朗读</button>
        <button id="pauseBtn" disabled>暂停</button>
        <button id="resumeBtn" disabled>继续朗读</button>
        <button id="backwardBtn" disabled>⏪ 后退</button>
        <button id="copyBtn" disabled>复制剩余文本</button>
    </div>

    <script>
        const synth = window.speechSynthesis;
        
        const STORAGE_KEY_TEXT = 'tts_reader_text';
        const STORAGE_KEY_POSITION = 'tts_reader_position';
        const SAVE_POSITION_INTERVAL_MS = 2000;
        const SAVE_TEXT_DEBOUNCE_MS = 500;
        
        let fullText = '';
        let segments = [];
        let currentSegmentIndex = 0;
        let currentCharIndex = 0;
        let utterance = null;
        let isPaused = false;
        let lastPositionSaveTime = 0;
        let saveTextDebounceTimer = null;
        
        const voiceSelect = document.getElementById('voiceSelect');
        const rateInput = document.getElementById('rateInput');
        const rateDisplay = document.getElementById('rateDisplay');
        const backwardWords = document.getElementById('backwardWords');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resumeBtn = document.getElementById('resumeBtn');
        const backwardBtn = document.getElementById('backwardBtn');
        const copyBtn = document.getElementById('copyBtn');
        const textInput = document.getElementById('textInput');

        function cleanText(text) {
            return text.replace(/[#*]/g, '');
        }

        function saveTextToStorage() {
            const text = textInput.value;
            try {
                localStorage.setItem(STORAGE_KEY_TEXT, text);
            } catch (e) {
                if (e.name === 'QuotaExceededError') {
                    console.warn('TTS Reader: localStorage full, could not save text.');
                }
            }
        }

        function savePositionToStorage(immediate) {
            if (!immediate) {
                const now = Date.now();
                if (now - lastPositionSaveTime < SAVE_POSITION_INTERVAL_MS) return;
                lastPositionSaveTime = now;
            }
            try {
                localStorage.setItem(STORAGE_KEY_POSITION, String(currentCharIndex));
            } catch (e) {}
        }

        function loadFromStorage() {
            const savedText = localStorage.getItem(STORAGE_KEY_TEXT);
            if (savedText != null) {
                textInput.value = savedText;
            }
            const savedPos = localStorage.getItem(STORAGE_KEY_POSITION);
            if (savedPos !== null && savedText != null && savedText.length > 0) {
                fullText = cleanText(savedText);
                const pos = Math.max(0, Math.min(parseInt(savedPos, 10) || 0, fullText.length));
                currentCharIndex = pos;
                if (currentCharIndex > 0 && currentCharIndex < fullText.length) {
                    isPaused = true;
                    updateButtonStates('paused');
                }
            }
        }

        function debouncedSaveText() {
            if (saveTextDebounceTimer) clearTimeout(saveTextDebounceTimer);
            saveTextDebounceTimer = setTimeout(saveTextToStorage, SAVE_TEXT_DEBOUNCE_MS);
        }

        function updateButtonStates(state) {
            const states = {
                idle: { start: false, pause: true, resume: true, backward: true, copy: true },
                playing: { start: true, pause: false, resume: true, backward: false, copy: false },
                paused: { start: true, pause: true, resume: false, backward: false, copy: false }
            };
            
            const s = states[state];
            startBtn.disabled = s.start;
            pauseBtn.disabled = s.pause;
            resumeBtn.disabled = s.resume;
            backwardBtn.disabled = s.backward;
            copyBtn.disabled = s.copy;
        }

        function buildSegments(text, startOffset, maxLen) {
            const sentences = text.match(/[^\n.!?。！？]+[\n.!?。！？]?/g) || [];
            const segs = [];
            let current = '';
            let currentStart = startOffset;
            
            sentences.forEach((sent) => {
                if ((current + sent).length > maxLen) {
                    if (current) {
                        segs.push({ text: current, start: currentStart });
                        currentStart += current.length;
                    }
                    current = sent;
                } else {
                    current += sent;
                }
            });
            
            if (current) {
                segs.push({ text: current, start: currentStart });
            }
            
            return segs;
        }

        function updateMediaSession(state) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: '朗读助手',
                    artist: '',
                    album: '',
                    artwork: []
                });
                
                try {
                    navigator.mediaSession.playbackState = state;
                } catch (e) {}
                
                navigator.mediaSession.setActionHandler('play', () => {
                    if (isPaused) {
                        resumeReading();
                    } else if (!synth.speaking && textInput.value.trim()) {
                        startReading();
                    }
                });
                
                navigator.mediaSession.setActionHandler('pause', () => {
                    if (synth.speaking) pauseReading();
                });
            }
        }

        function speakSegment() {
            if (isPaused || currentSegmentIndex >= segments.length) {
                return;
            }
            
            const seg = segments[currentSegmentIndex];
            const u = new SpeechSynthesisUtterance(seg.text);
            
            const voices = synth.getVoices();
            const matched = voices.find((v) => v.name === voiceSelect.value);
            if (matched) u.voice = matched;
            
            u.rate = parseFloat(rateInput.value) || 1;
            
            u.onboundary = (event) => {
                currentCharIndex = seg.start + event.charIndex;
                savePositionToStorage();
            };
            
            u.onend = () => {
                currentCharIndex = seg.start + seg.text.length;
                currentSegmentIndex++;
                savePositionToStorage(true);
                
                if (!isPaused && currentSegmentIndex < segments.length) {
                    speakSegment();
                } else {
                    const state = currentCharIndex >= fullText.length ? 'idle' : 'paused';
                    updateButtonStates(state);
                    updateMediaSession(state === 'idle' ? 'none' : 'paused');
                }
            };
            
            utterance = u;
            synth.speak(u);
            updateButtonStates('playing');
            updateMediaSession('playing');
        }

        function startReading() {
            const rawText = textInput.value.trim();
            if (!rawText) {
                alert('请输入或粘贴文本。');
                return;
            }
            
            saveTextToStorage();
            synth.cancel();
            fullText = cleanText(rawText);
            currentCharIndex = 0;
            savePositionToStorage(true);
            segments = buildSegments(fullText, 0, 1500);
            currentSegmentIndex = 0;
            isPaused = false;
            speakSegment();
        }

        function pauseReading() {
            if (synth.speaking) {
                isPaused = true;
                synth.cancel();
                savePositionToStorage(true);
                updateButtonStates('paused');
                updateMediaSession('paused');
            }
        }

        function resumeReading() {
            if (!isPaused || currentCharIndex >= fullText.length) return;
            
            isPaused = false;
            const remaining = fullText.substring(currentCharIndex);
            segments = buildSegments(remaining, currentCharIndex, 1500);
            currentSegmentIndex = 0;
            speakSegment();
        }

        function goBackward() {
            if (!fullText || currentCharIndex <= 0) return;
            
            // Stop current playback
            synth.cancel();
            isPaused = true;
            
            // Get the portion of text before current position
            const textBefore = fullText.substring(0, currentCharIndex);
            
            // Get number of words to go back
            const wordsToGoBack = parseInt(backwardWords.value) || 10;
            
            // Split by word boundaries (spaces, punctuation, Chinese characters)
            // For Chinese text, each character is treated as a potential word boundary
            const words = [];
            let currentWord = '';
            
            for (let i = 0; i < textBefore.length; i++) {
                const char = textBefore[i];
                const isChinese = /[\u4e00-\u9fa5]/.test(char);
                const isSpace = /\s/.test(char);
                const isPunctuation = /[,.!?;:，。！？；：、]/.test(char);
                
                if (isChinese) {
                    // Each Chinese character can be a word
                    if (currentWord) {
                        words.push({ word: currentWord, endIndex: i });
                        currentWord = '';
                    }
                    words.push({ word: char, endIndex: i + 1 });
                } else if (isSpace || isPunctuation) {
                    if (currentWord) {
                        words.push({ word: currentWord, endIndex: i });
                        currentWord = '';
                    }
                    if (!isSpace) {
                        words.push({ word: char, endIndex: i + 1 });
                    }
                } else {
                    currentWord += char;
                }
            }
            
            if (currentWord) {
                words.push({ word: currentWord, endIndex: textBefore.length });
            }
            
            // Go back the specified number of words
            const targetIndex = Math.max(0, words.length - wordsToGoBack);
            const newCharIndex = targetIndex > 0 ? words[targetIndex].endIndex - words[targetIndex].word.length : 0;
            
            // Update position
            currentCharIndex = newCharIndex;
            
            // Resume from new position
            isPaused = false;
            const remaining = fullText.substring(currentCharIndex);
            segments = buildSegments(remaining, currentCharIndex, 1500);
            currentSegmentIndex = 0;
            speakSegment();
        }

        function populateVoiceList() {
            const voices = synth.getVoices();
            voiceSelect.innerHTML = '';
            
            voices.forEach((voice) => {
                const option = document.createElement('option');
                option.value = voice.name;
                option.textContent = `${voice.name} (${voice.lang})`;
                voiceSelect.appendChild(option);
            });
            
            const savedVoiceName = localStorage.getItem('selectedVoice');
            if (savedVoiceName) {
                for (let i = 0; i < voiceSelect.options.length; i++) {
                    if (voiceSelect.options[i].value === savedVoiceName) {
                        voiceSelect.selectedIndex = i;
                        break;
                    }
                }
            }
        }

        function updateRateDisplay() {
            const rate = parseFloat(rateInput.value) || 1;
            rateDisplay.textContent = `${rate.toFixed(1)}x`;
            localStorage.setItem('selectedRate', rate.toString());
        }

        function initRate() {
            const savedRate = localStorage.getItem('selectedRate');
            if (savedRate) rateInput.value = savedRate;
            updateRateDisplay();
        }

        function initBackwardWords() {
            const savedWords = localStorage.getItem('backwardWords');
            if (savedWords) backwardWords.value = savedWords;
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(text);
            }
            
            return new Promise((resolve, reject) => {
                try {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    document.body.appendChild(textarea);
                    textarea.focus();
                    textarea.select();
                    const successful = document.execCommand('copy');
                    document.body.removeChild(textarea);
                    successful ? resolve() : reject(new Error('execCommand failed'));
                } catch (err) {
                    reject(err);
                }
            });
        }

        // Event listeners
        startBtn.addEventListener('click', startReading);
        pauseBtn.addEventListener('click', pauseReading);
        resumeBtn.addEventListener('click', resumeReading);
        backwardBtn.addEventListener('click', goBackward);
        
        copyBtn.addEventListener('click', () => {
            if (!fullText || currentCharIndex >= fullText.length) return;
            
            const remaining = fullText.substring(currentCharIndex);
            
            copyToClipboard(remaining).then(() => {
                fullText = remaining;
                currentCharIndex = 0;
                segments = [];
                currentSegmentIndex = 0;
                textInput.value = remaining;
                saveTextToStorage();
                savePositionToStorage(true);
                synth.cancel();
                isPaused = false;
                updateButtonStates('idle');
                updateMediaSession('none');
                alert('剩余文本已复制到剪贴板！');
            }).catch(() => {
                alert('复制失败，请尝试手动选择文本并复制。');
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.altKey && e.key.toLowerCase() === 's') {
                e.preventDefault();
                if (synth.speaking && !isPaused) {
                    pauseReading();
                } else if (isPaused) {
                    resumeReading();
                }
            }
            
            // Alt+B for backward
            if (e.altKey && e.key.toLowerCase() === 'b') {
                e.preventDefault();
                if (!backwardBtn.disabled) {
                    goBackward();
                }
            }
        });

        rateInput.addEventListener('input', updateRateDisplay);
        voiceSelect.addEventListener('change', () => {
            localStorage.setItem('selectedVoice', voiceSelect.value);
        });
        backwardWords.addEventListener('change', () => {
            localStorage.setItem('backwardWords', backwardWords.value);
        });

        textInput.addEventListener('input', debouncedSaveText);
        textInput.addEventListener('paste', () => {
            setTimeout(debouncedSaveText, 0);
        });

        window.addEventListener('beforeunload', () => {
            savePositionToStorage(true);
            saveTextToStorage();
        });

        // Initialize
        loadFromStorage();
        populateVoiceList();
        if (typeof synth.onvoiceschanged !== 'undefined') {
            synth.onvoiceschanged = populateVoiceList;
        }
        initRate();
        initBackwardWords();
        if (currentCharIndex <= 0 || currentCharIndex >= fullText.length) {
            updateButtonStates('idle');
        }
    </script>
</body>
</html>
