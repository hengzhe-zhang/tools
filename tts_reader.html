<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>朗读助手</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            line-height: 1.6;
            background-color: #121212;
            color: #eeeeee;
        }
        h1 {
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            min-height: 250px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #444;
            border-radius: 4px;
            box-sizing: border-box;
            resize: vertical;
            background-color: #1e1e1e;
            color: #eeeeee;
        }
        .controls {
            margin-top: 15px;
        }
        button {
            padding: 8px 16px;
            margin-right: 10px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: #0066cc;
            color: #ffffff;
        }
        button:disabled {
            background-color: #444444;
            color: #888888;
            cursor: not-allowed;
        }
        select, input[type="number"] {
            background-color: #1e1e1e;
            color: #eeeeee;
            border: 1px solid #444;
        }
    </style>
</head>
<body>
    <h1>朗读助手</h1>
    <p>这是一个简洁的文本朗读工具，利用浏览器的语音合成功能将文字朗读出来。您可以选择朗读人、调整朗读速度，并在工作之余小憩时用它来放松。所有设置会自动记忆，下次使用时自动加载。</p>
    
    <label for="textInput" style="display:none;">输入文本</label>
    <textarea id="textInput" placeholder="在此粘贴或输入文本"></textarea>
    
    <div class="controls" style="margin-top: 10px;">
        <label for="voiceSelect">朗读人：</label>
        <select id="voiceSelect" style="margin-right: 20px;"></select>
        
        <label for="rateInput">速度：</label>
        <input id="rateInput" type="number" min="0.5" max="2" step="0.1" value="1" style="width:60px; margin-right: 20px;" />
        <span id="rateDisplay"></span>
    </div>
    
    <div class="controls" style="margin-top: 15px;">
        <button id="startBtn">开始朗读</button>
        <button id="pauseBtn" disabled>暂停</button>
        <button id="resumeBtn" disabled>继续朗读</button>
        <button id="copyBtn" disabled>复制剩余文本</button>
    </div>

    <script>
        const synth = window.speechSynthesis;
        
        let fullText = '';
        let segments = [];
        let currentSegmentIndex = 0;
        let currentCharIndex = 0;
        let utterance = null;
        let isPaused = false;
        
        const voiceSelect = document.getElementById('voiceSelect');
        const rateInput = document.getElementById('rateInput');
        const rateDisplay = document.getElementById('rateDisplay');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resumeBtn = document.getElementById('resumeBtn');
        const copyBtn = document.getElementById('copyBtn');

        function cleanText(text) {
            return text.replace(/[#*]/g, '');
        }

        function updateButtonStates(state) {
            const states = {
                idle: { start: false, pause: true, resume: true, copy: true },
                playing: { start: true, pause: false, resume: true, copy: false },
                paused: { start: true, pause: true, resume: false, copy: false }
            };
            
            const s = states[state];
            startBtn.disabled = s.start;
            pauseBtn.disabled = s.pause;
            resumeBtn.disabled = s.resume;
            copyBtn.disabled = s.copy;
        }

        function buildSegments(text, startOffset, maxLen) {
            const sentences = text.match(/[^\n.!?。！？]+[\n.!?。！？]?/g) || [];
            const segs = [];
            let current = '';
            let currentStart = startOffset;
            
            sentences.forEach((sent) => {
                if ((current + sent).length > maxLen) {
                    if (current) {
                        segs.push({ text: current, start: currentStart });
                        currentStart += current.length;
                    }
                    current = sent;
                } else {
                    current += sent;
                }
            });
            
            if (current) {
                segs.push({ text: current, start: currentStart });
            }
            
            return segs;
        }

        function updateMediaSession(state) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: '朗读助手',
                    artist: '',
                    album: '',
                    artwork: []
                });
                
                try {
                    navigator.mediaSession.playbackState = state;
                } catch (e) {}
                
                navigator.mediaSession.setActionHandler('play', () => {
                    if (isPaused) {
                        resumeReading();
                    } else if (!synth.speaking && document.getElementById('textInput').value.trim()) {
                        startReading();
                    }
                });
                
                navigator.mediaSession.setActionHandler('pause', () => {
                    if (synth.speaking) pauseReading();
                });
            }
        }

        function speakSegment() {
            if (isPaused || currentSegmentIndex >= segments.length) {
                return;
            }
            
            const seg = segments[currentSegmentIndex];
            const u = new SpeechSynthesisUtterance(seg.text);
            
            const voices = synth.getVoices();
            const matched = voices.find((v) => v.name === voiceSelect.value);
            if (matched) u.voice = matched;
            
            u.rate = parseFloat(rateInput.value) || 1;
            
            u.onboundary = (event) => {
                currentCharIndex = seg.start + event.charIndex;
            };
            
            u.onend = () => {
                currentCharIndex = seg.start + seg.text.length;
                currentSegmentIndex++;
                
                if (!isPaused && currentSegmentIndex < segments.length) {
                    speakSegment();
                } else {
                    const state = currentCharIndex >= fullText.length ? 'idle' : 'paused';
                    updateButtonStates(state);
                    updateMediaSession(state === 'idle' ? 'none' : 'paused');
                }
            };
            
            utterance = u;
            synth.speak(u);
            updateButtonStates('playing');
            updateMediaSession('playing');
        }

        function startReading() {
            const rawText = document.getElementById('textInput').value.trim();
            if (!rawText) {
                alert('请输入或粘贴文本。');
                return;
            }
            
            synth.cancel();
            fullText = cleanText(rawText);
            currentCharIndex = 0;
            segments = buildSegments(fullText, 0, 1500);
            currentSegmentIndex = 0;
            isPaused = false;
            speakSegment();
        }

        function pauseReading() {
            if (synth.speaking) {
                isPaused = true;
                synth.cancel();
                updateButtonStates('paused');
                updateMediaSession('paused');
            }
        }

        function resumeReading() {
            if (!isPaused || currentCharIndex >= fullText.length) return;
            
            isPaused = false;
            const remaining = fullText.substring(currentCharIndex);
            segments = buildSegments(remaining, currentCharIndex, 1500);
            currentSegmentIndex = 0;
            speakSegment();
        }

        function populateVoiceList() {
            const voices = synth.getVoices();
            voiceSelect.innerHTML = '';
            
            voices.forEach((voice) => {
                const option = document.createElement('option');
                option.value = voice.name;
                option.textContent = `${voice.name} (${voice.lang})`;
                voiceSelect.appendChild(option);
            });
            
            const savedVoiceName = localStorage.getItem('selectedVoice');
            if (savedVoiceName) {
                for (let i = 0; i < voiceSelect.options.length; i++) {
                    if (voiceSelect.options[i].value === savedVoiceName) {
                        voiceSelect.selectedIndex = i;
                        break;
                    }
                }
            }
        }

        function updateRateDisplay() {
            const rate = parseFloat(rateInput.value) || 1;
            rateDisplay.textContent = `${rate.toFixed(1)}x`;
            localStorage.setItem('selectedRate', rate.toString());
        }

        function initRate() {
            const savedRate = localStorage.getItem('selectedRate');
            if (savedRate) rateInput.value = savedRate;
            updateRateDisplay();
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(text);
            }
            
            return new Promise((resolve, reject) => {
                try {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    document.body.appendChild(textarea);
                    textarea.focus();
                    textarea.select();
                    const successful = document.execCommand('copy');
                    document.body.removeChild(textarea);
                    successful ? resolve() : reject(new Error('execCommand failed'));
                } catch (err) {
                    reject(err);
                }
            });
        }

        // Event listeners
        startBtn.addEventListener('click', startReading);
        pauseBtn.addEventListener('click', pauseReading);
        resumeBtn.addEventListener('click', resumeReading);
        
        copyBtn.addEventListener('click', () => {
            if (!fullText || currentCharIndex >= fullText.length) return;
            
            const remaining = fullText.substring(currentCharIndex);
            
            copyToClipboard(remaining).then(() => {
                fullText = remaining;
                currentCharIndex = 0;
                segments = [];
                currentSegmentIndex = 0;
                document.getElementById('textInput').value = remaining;
                synth.cancel();
                isPaused = false;
                updateButtonStates('idle');
                updateMediaSession('none');
                alert('剩余文本已复制到剪贴板！');
            }).catch(() => {
                alert('复制失败，请尝试手动选择文本并复制。');
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.altKey && e.key.toLowerCase() === 's') {
                e.preventDefault();
                if (synth.speaking && !isPaused) {
                    pauseReading();
                } else if (isPaused) {
                    resumeReading();
                }
            }
        });

        rateInput.addEventListener('input', updateRateDisplay);
        voiceSelect.addEventListener('change', () => {
            localStorage.setItem('selectedVoice', voiceSelect.value);
        });

        // Initialize
        populateVoiceList();
        if (typeof synth.onvoiceschanged !== 'undefined') {
            synth.onvoiceschanged = populateVoiceList;
        }
        initRate();
        updateButtonStates('idle');
    </script>
</body>
</html>
